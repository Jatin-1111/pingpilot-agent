name: release

# An alternative to scripts/release.sh: publishes binaries for every platform, checksums.txt, install.sh and the container
# image from GitHub's machines. Run it by hand (Actions tab > release > Run workflow, on a tag), or put
#   push: { tags: ["v*"] }
# back under `on:` to run it whenever a tag is pushed. Do not use both for the same version.
on:
  workflow_dispatch:

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload to it
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # lets anyone check that a downloaded binary was built here from this tag: gh attestation verify <file> --repo <repo>
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/pingpilot-agent_*

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ github.ref_name }}
